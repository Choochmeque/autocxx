[package]
name = "autocxx-patch-check"
version = "0.30.0"
authors = ["adetaylor <adetaylor@chromium.org>"]
edition = "2021"
# CI plumbing for this repository, not something to release.
publish = false

[dependencies]
# What `engine/build.rs` applies the series with. Kept at the version the
# engine's build-dependency asks for: a different applier would match hunks by
# different rules and this check would answer a different question.
diffy = "0.5"
