[package]
name = "autocxx"
version = "0.30.0"
authors = ["Adrian Taylor <adetaylor@chromium.org>"]
license = "MIT OR Apache-2.0"
description = "Safe autogenerated interop between Rust and C++"
repository = "https://github.com/google/autocxx"
homepage = "https://google.github.io/autocxx/"
edition = "2021"
keywords = ["ffi"]
categories = ["development-tools::ffi", "api-bindings"]
exclude = [ ".github", "book", "tools" ]
rust-version = "1.88"

# This is stricter about avoiding optional features in dependencies
# such as 'syn'. We build this way such that CI spots any mistakes
# where we are depending on such features.
resolver = "2"

[features]
default = ["c-type-vectors"]
arbitrary_self_types = []
# Declares `std::vector`, `std::unique_ptr`, `std::shared_ptr` and
# `std::weak_ptr` glue for the `autocxx::c_*` newtypes, so that a
# `std::vector<int>` or `std::unique_ptr<int>` (or `long`, `short`,
# `long long`, signed or unsigned, or `char16_t`, `char32_t` or `wchar_t`)
# can cross a bridge - see google/autocxx#422. cxx implements `VectorElement`
# and `UniquePtrTarget` only for the types it knows natively, and the orphan
# rule stops a generated bridge implementing them for our types, so this crate
# has to. The name predates the smart pointers and is kept for compatibility.
#
# It is what makes this crate compile C++ of its own, which is why it can be
# turned off: without it nothing here needs `cxx-build`, which suits a
# parse-only, pre-generated or non-Cargo consumer. Turning it off breaks
# nothing that doesn't use such a container; a binding that does fails to
# compile with cxx's own "the trait `VectorElement` is not implemented for
# `autocxx::c_int`", which names what to turn back on.
c-type-vectors = ["dep:cxx-build"]

[dependencies]
autocxx-macro = { path="macro", version="0.30.0" }
# Two things set the floor. `reference_wrapper.rs` needs `UniquePtr::as_ptr` and
# `as_mut_ptr`, which both first appear in cxx 1.0.136 (1.0.135 has neither). The
# binding one is 1.0.161, which deleted `#[automatically_derived]` from the impl
# blocks `cxxbridge-macro` emits which are not trait impls: the inherent one
# carrying a bridge type's methods, and the one carrying a shared enum's
# variants. Every release from 1.0.136 to 1.0.160 emits both, and rustc reports
# them as `unused_attributes` - "will become a hard error in a future release" -
# against the span of the bridge we generated rather than against anything in
# cxx. So a `-Z minimal-versions` resolve below either point picks a cxx this
# crate cannot build against, or one which deprecates our own output.
#
# Once either side is 1.0.189 or newer, whatever version is resolved has to
# agree on the patch level with the cxx-gen that autocxx-engine generates C++
# with: from that release the patch level is part of the symbol of every
# function a bridge declares (`cxxbridge1$199$f`), so a mismatch leaves every
# call of one referring to a symbol that appears in nobody's source. Two
# versions from before it name those functions `cxxbridge1$f` and agree. No version requirement can ask for that - only an exact pin
# would, and that would stop downstream crates choosing any other cxx - so
# `autocxx-build` checks it at build time instead. See
# `engine/src/cxx_version_parity.rs`.
cxx = "1.0.161" # ... also needed because expansion of type_id refers to ::cxx
moveit = { version = "0.6", features = [ "cxx" ] }

[build-dependencies]
# Compiles the `std::vector` glue for the `c_*` newtypes - see `build.rs`.
# Optional so that `--no-default-features` leaves this a pure-Rust crate.
cxx-build = { version = "1.0.161", optional = true }

[workspace]
members = ["parser", "engine", "gen/cmd", "gen/build", "macro", "demo", "tools/reduce", "tools/mdbook-preprocessor", "tools/patch-check", "integration-tests", "integration-tests/fixture-deps"]
exclude = ["examples/s2", "examples/steam-mini", "examples/subclass", "examples/chromium-fake-render-frame-host", "examples/pod", "examples/non-trivial-type-on-stack", "examples/llvm", "examples/reference-wrappers", "examples/cpp_calling_rust", "tools/stress-test"]

#[patch.crates-io]
#cxx = { path="../cxx" }
#cxx-gen = { path="../cxx/gen/lib" }
#autocxx-bindgen = { path="../bindgen/bindgen" }
#moveit = { path="../moveit" }
