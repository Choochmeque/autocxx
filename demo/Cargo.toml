[package]
name = "autocxx-demo"
version = "0.30.0"
authors = ["Adrian Taylor <adetaylor@chromium.org>", "Vladimir Pankratov <sollex.uz@gmail.com>"]
edition = "2021"
# Holds no crates.io name, and would have one created for it by a publish
# which took the workspace rather than a named set.
publish = false

[dependencies]
cxx = "1.0.161"
autocxx = { path = "..", version = "0.30.0" }

[build-dependencies]
autocxx-build = { path = "../gen/build", version = "0.30.0" }
miette = { version = "5", features = ["fancy"] }
