[package]
name = "autocxx-engine"
version = "0.30.0"
authors = ["Adrian Taylor <adetaylor@chromium.org>"]
# `AND BSD-3-Clause` because the published crate carries bindgen's sources; see
# the `include` list below. autocxx's own code is still MIT or Apache-2.0.
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
description = "Safe autogenerated interop between Rust and C++"
repository = "https://github.com/google/autocxx"
edition = "2021"
build = "build.rs"
keywords = ["ffi"]
categories = ["development-tools::ffi", "api-bindings"]
# `third_party/bindgen-src` is bindgen's sources flattened out of the submodule
# by `AUTOCXX_VENDOR_BINDGEN=1 cargo build -p autocxx-engine`, which is a step
# before `cargo publish`; `build.rs` reads it only where there is no submodule to
# read instead, which is what a published crate is. Publishing needs it because `cargo package` prunes every directory below the package root which
# holds a `Cargo.toml`, reading it as a separate package, and the submodule has
# two - so the submodule itself can never reach crates.io. The flattening
# renames those manifests.
#
# The published crate therefore carries BSD-3-Clause code (bindgen) alongside
# autocxx's own MIT/Apache-2.0. bindgen's own LICENSE sits in the directory
# being copied, so it travels with the sources.
include = [
    "src/**/*.rs",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "third_party/patches/*.patch",
    "third_party/bindgen-src/**",
]

[features]
default = ["reproduction_case", "runtime"]
build = ["cc"]
nightly = []                                                           # for doc generation purposes only; used by docs.rs
reproduction_case = ["serde_json", "autocxx-parser/reproduction_case"]
# Forwarded to clang-sys, which the vendored bindgen links against.
runtime = ["clang-sys/runtime"]
static = ["clang-sys/static"]

[dependencies]
log = "0.4"
proc-macro2 = "1.0.80"
quote = "1.0"
indoc = "1.0"
# bindgen is vendored, not depended on: `build.rs` patches the sources in
# `third_party/rust-bindgen` into OUT_DIR and `src/lib.rs` mounts them as
# `crate::vendored_bindgen`. These are the dependencies that copy needs, taken
# from `third_party/rust-bindgen/bindgen/Cargo.toml`. Versions have to stay at
# or above what that manifest asks for.
bitflags = "2.2.1"
cexpr = "0.6"
clang-sys = { version = "1", features = ["clang_11_0"] }
rustc-hash = "2.1.0"
itertools = "0.10.3"
# Only to read BINDGEN_EXTRA_CLANG_ARGS exactly as bindgen reads it - see
# src/clang_target.rs. Already in the tree: bindgen and cc both use it.
shlex = "2"
cc = { version = "1.0", optional = true }
# Note: Keep the patch-level version of cxx-gen and cxx in sync.
# There can be interdependencies between the code generated by cxx-gen and
# what cxx expects to be there. Since cxx 1.0.189 that is not a matter of
# degree: the patch level is mangled into the symbol of every function a bridge
# declares (`cxxbridge1$199$f`), so cxx-gen 0.7.199 and cxx 1.0.190 produce halves
# of each function which never find each other, and the link fails naming a
# symbol nobody wrote. Cargo cannot be asked to keep them level, so
# `autocxx-build` checks at build time - see `src/cxx_version_parity.rs`.
# This floor tracks the cxx floor in the root manifest so that a minimal resolve
# takes a matched pair. That check does not require it: two crates from before
# 1.0.189 use the same unversioned names whatever their patch levels.
cxx-gen = "0.7.161"
autocxx-parser = { version = "=0.30.0", path = "../parser" }
version_check = "0.9"
# 3.10 for `Builder::permissions`, which is how a staged output is given the
# mode its destination had before the umask can narrow it - see
# `src/atomic_write.rs`.
tempfile = "3.10"
once_cell = "1.7"
serde_json = { version = "1.0", optional = true }
miette = "5"
thiserror = "1"
regex = "1.5.3" # the floor the vendored bindgen asks for
regex_static = "0.1"
indexmap = "1.8"
prettyplease = { version = "0.2.6", features = ["verbatim"] }
rustversion = "1.0"

[dependencies.syn]
version = "2.0.1"
features = ["full", "printing", "visit-mut", "extra-traits"]
#features = [ "full", "printing", "visit-mut", "extra-traits" ]

[package.metadata.docs.rs]
features = ["build", "nightly"]

[build-dependencies]
# Applies third_party/patches to the bindgen submodule sources. A real patch
# applier rather than a string substitution so that a submodule moved off the
# tag the series was rebased onto fails loudly instead of silently.
diffy = "0.5"

[dev-dependencies]
cc = "1.0"
