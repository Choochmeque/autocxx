# Flags newly-introduced dependencies with known vulnerabilities or
# disallowed licenses on each pull request, using the GitHub advisory
# database. See https://github.com/google/autocxx/issues/1128.
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
