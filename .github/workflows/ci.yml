name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule: [cron: "40 1 * * *"]
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  # CI builds don't benefit very much from this and it has bugs
  CARGO_INCREMENTAL: 0
  # We can't use a debugger in CI. Limited debuginfo (=1) builds faster and
  # caches smaller than the default (=2) while keeping file:line in panic
  # backtraces; =0 would shrink further, but windows-msvc symbolizes
  # backtraces from PDBs, so it would leave failures there as bare
  # addresses. Jobs that run no tests use =0 instead; the asan job also
  # keeps its pre-existing =0 (linux-only, diagnosed through the
  # sanitizer's own reports). Jobs that define their own RUSTFLAGS must
  # restate the choice, because job-level env replaces this value rather
  # than appending to it.
  RUSTFLAGS: -Cdebuginfo=1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{matrix.name || format('Rust {0}', matrix.rust)}}
    runs-on: ${{matrix.os || 'ubuntu'}}-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - rust: nightly
          - rust: beta
          - rust: stable
          - name: macOS
            rust: nightly
            os: macos
          # Disabled upstream in 2022 for never-diagnosed failures
          # (google/autocxx#1134). Turned back on advisorily in 2026, which
          # revealed the cause of eight of its ten failures: nothing told
          # clang to parse headers for a GNU target, so it used Microsoft's
          # standard library and ABI while g++ compiled the generated C++
          # against libstdc++. With that fixed (engine/src/clang_target.rs)
          # the leg ran fully green and the job is blocking like its msvc
          # sibling. The skip list went from twelve entries to two, and the
          # last two are off for this run as well: both carried a hypothesis
          # which only a run without the skip could settle, so this leg is
          # the experiment - and both hypotheses resolved: one fixture bug
          # fixed, one stale entry. No skip machinery remains anywhere.
          - name: Windows (gnu)
            rust: nightly-x86_64-pc-windows-gnu
            os: windows
          - name: Windows (msvc)
            rust: nightly-x86_64-pc-windows-msvc
            os: windows
            flags: /EHsc
    env:
      CXXFLAGS: ${{matrix.flags}}
      RUSTFLAGS: --cfg deny_warnings -Dwarnings -Cdebuginfo=1

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
          components: rustfmt
      # The `{ shared-key: ... }` allows different jobs to share the cache.
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: fullBuild }
      # For operating systems that have it packaged, install creduce.
      # AUTOCXX_RUN_REDUCTION_TESTS is what makes autocxx-reduce's end-to-end
      # reductions run at all: they take minutes to hours, so they are opt-in
      # rather than part of everyone's `cargo test --workspace`. Setting it
      # here, in the step that installs creduce, keeps the two together - the
      # legs which have creduce run the reductions, and no others.
      - name: Install creduce (Linux)
        if: matrix.os == ''
        run: |
          sudo apt-get install creduce
          echo AUTOCXX_RUN_REDUCTION_TESTS=1 >> "$GITHUB_ENV"
      - name: Install creduce (MacOS)
        if: matrix.os == 'macOS'
        run: |
          brew install creduce
          echo AUTOCXX_RUN_REDUCTION_TESTS=1 >> "$GITHUB_ENV"
      - name: Set LIBCLANG_PATH (Windows)
        # Windows github action doesn't set the path for clang, so set it
        # See https://github.com/rust-lang/rust-bindgen/issues/1797
        if: matrix.os == 'windows'
        run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV
      - name: Exclude failing targets and tests
        # Reconnaissance: autocxx-reduce and autocxx-gen have been excluded
        # on Windows since 2022 ("autocxx-gen also fails on Windows" -
        # never diagnosed). The creduce-needing reduce tests are env-gated
        # behind AUTOCXX_RUN_REDUCTION_TESTS these days, so both packages'
        # remaining tests may simply work; running to find out.
        # This deliberately drops deny_warnings from the job-level RUSTFLAGS
        # for the suite itself - the fixtures are not warning-clean and are
        # not meant to be - while keeping the workflow's debuginfo choice.
        # It historically also carried the per-leg skip cfgs, the last of
        # which retired in 2026 when every skip on both Windows lists turned
        # out fixed or fixable.
        run: |
          echo RUSTFLAGS=$RUSTFLAGS >> $GITHUB_ENV
          echo exclude= >> "$GITHUB_OUTPUT"
        env:
          RUSTFLAGS: "-Cdebuginfo=1"
        id: testsuite
        shell: bash
      - run: cargo test --workspace ${{steps.testsuite.outputs.exclude}}

  # Every other job runs on nightly, beta or stable, so nothing checks that we
  # still build on the version `rust-version` in Cargo.toml promises. Compile
  # only - running the suite here would double the cost of CI to tell us
  # something the `test` job already knows.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with `rust-version` in the top-level Cargo.toml.
          toolchain: "1.88"
      # Its own cache: artifacts built by this toolchain are no use to the
      # jobs sharing `fullBuild`, and vice versa.
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: msrv }
      # `--locked` so that this tests the dependency versions we ship, rather
      # than whatever the resolver picks on the day.
      - run: cargo check --workspace --all-targets --locked

  # Run the integration suite under pinned libclang versions rather
  # than whatever the runner ships. libclang 22 changed
  # clang_getTypeDeclaration to return forward declarations (see
  # upstream google/autocxx#1509 and rust-lang/rust-bindgen#3278),
  # which silently corrupts bindings for out-of-line nested class
  # definitions. The 22/23 cells are expected to stay red until a
  # bindgen with that fix is adopted; afterwards this matrix guards
  # against future libclang behavior changes.
  test-libclang:
    name: Test libclang ${{matrix.libclang}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libclang: [19, 21, 22, 23]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: libclang-matrix }
      - name: Install LLVM ${{matrix.libclang}}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{matrix.libclang}}
      - run: cargo test -p autocxx-integration-tests
        env:
          LIBCLANG_PATH: /usr/lib/llvm-${{matrix.libclang}}/lib

  examples:
    name: Examples ${{matrix.name || format('Rust {0}', matrix.rust)}}
    runs-on: ${{matrix.os || 'ubuntu'}}-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: nightly
          - rust: beta
          - rust: stable
          - name: macOS
            rust: nightly
            os: macos
          - name: Windows (gnu)
            rust: nightly-x86_64-pc-windows-gnu
            os: windows
          - name: Windows (msvc)
            rust: nightly-x86_64-pc-windows-msvc
            os: windows
            # For cxx's build script compiling cxx.cc: it adds no /EH
            # model, and deny_warnings below makes its C4530 fatal.
            # autocxx's own Builder passes /EHsc regardless.
            flags: /EHsc
    env:
      CXXFLAGS: ${{matrix.flags}}
      # Build-only job, so =0 is nearly free: no test ever runs here. Build
      # scripts and proc macros do run and compile under this flag too, but
      # a build.rs panic reports its own file:line without debuginfo, and
      # losing frames beyond that is an accepted tradeoff.
      RUSTFLAGS: --cfg deny_warnings -Dwarnings -Cdebuginfo=0
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: fullBuild }
      - name: Set LIBCLANG_PATH (Windows)
        # Windows github action doesn't set the path for clang, so set it
        # See https://github.com/rust-lang/rust-bindgen/issues/1797
        if: matrix.os == 'windows'
        run: echo "LIBCLANG_PATH=$((gcm clang).source -replace "clang.exe")" >> $env:GITHUB_ENV
      - name: Build s2 example
        working-directory: ./examples/s2
        run: cargo build
      - name: Build steam example
        working-directory: ./examples/steam-mini
        run: cargo build
      - name: Build subclass example
        working-directory: ./examples/subclass
        run: cargo build
      - name: Build pod example
        working-directory: ./examples/pod
        run: cargo build
      - name: Build chromium render-frame-host example
        working-directory: ./examples/chromium-fake-render-frame-host
        run: cargo build
      - name: Build non-trivial-type-on-stack example
        working-directory: ./examples/non-trivial-type-on-stack
        run: cargo build
      - name: Build reference-wrappers example
        working-directory: ./examples/reference-wrappers
        # Needs the arbitrary_self_types feature, so nightly only. The Windows
        # legs spell their toolchain nightly-x86_64-pc-windows-{gnu,msvc}, which
        # an equality test against 'nightly' silently skipped.
        if: startsWith(matrix.rust, 'nightly')
        run: cargo build
      - name: Build cpp_calling_rust example
        working-directory: ./examples/cpp_calling_rust
        run: cargo build
      # Ubuntu only: the distro's unversioned llvm-dev tracks ubuntu-latest,
      # build.rs finds it through llvm-config (loudly, if it can't), and one
      # platform is enough for a does-autocxx-still-digest-LLVM's-headers
      # canary. macOS would spend ~10 minutes brew-installing LLVM for the
      # same signal, and Windows LLVM distributions may not ship llvm-config.
      # The C++ compiler here is g++, deliberately: distro LLVM packages are
      # gcc-built, and gcc-compile/libclang-parse agree on Linux's single ABI.
      - name: Install LLVM development headers
        if: matrix.os == ''
        run: |
          sudo apt-get update
          sudo apt-get install llvm-dev
      - name: Build llvm example
        working-directory: ./examples/llvm
        if: matrix.os == ''
        run: cargo build

  sanitizer:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Need nightly rust.
      - uses: hecrj/setup-rust-action@v1
        with:
          rust-version: nightly
          components: rust-src
      # rustfmt: not used by the tests themselves, but bindgen's
      # which-rustfmt probe prints hundreds of spurious "rustfmt is not
      # installed" errors into this job's log without it. Added as a
      # separate step because the setup action cannot install two
      # components at once.
      - run: rustup component add rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Tests with asan
        env:
          AUTOCXX_ASAN: 1
          RUSTFLAGS: -Zsanitizer=address -Cdebuginfo=0
          RUSTDOCFLAGS: -Zsanitizer=address
          # Leak detection on: a generated wrapper losing a UniquePtr or Box
          # on some error path is exactly the bug class this job exists for,
          # and it was dark while detect_leaks=0. That (and RUST_BACKTRACE=0)
          # worked around rust-lang/rust#59125, libbacktrace's DWARF cache
          # reading as a leak - fixed years ago when std moved to gimli.
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=1"
          RUST_BACKTRACE: "1"
        run: cargo -Z build-std test --workspace --target x86_64-unknown-linux-gnu --exclude autocxx-macro

  force-wrapper-generation:
    name: Test forcing wrapper generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Tests generating all possible shims
        env:
          AUTOCXX_FORCE_WRAPPER_GENERATION: 1
        run: cargo test --workspace

  # Clippy check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests -- -Dclippy::all

  # Mention outdated dependencies
  outdated:
    name: Outdated
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/install@cargo-outdated
      - run: cargo outdated -R -w

  # Check rustfmt is good
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Detect cases where documentation links don't resolve and such.
  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v1
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: fullBuild }
      - run: |
          for package in $(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | .name'); do
            cargo rustdoc --color always -p "$package" -- -D warnings
          done
        env: { RUSTDOCFLAGS: -Dwarnings }
