name: github pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build preprocessor
        # ...and the `autocxx-trybuild-child` helper alongside it. The
        # preprocessor compiles the book's code examples through the integration
        # test harness, which runs each build in that helper so that it can
        # report the compiler's diagnostics. Without it a book example that stops
        # compiling fails this job with no indication of why.
        run: cargo build -p autocxx-mdbook-preprocessor -p autocxx-integration-tests

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Must stay on 0.5.x: tools/mdbook-preprocessor links the
          # mdbook-preprocessor 0.5 crate and only parses the render context
          # emitted by mdBook 0.5.
          mdbook-version: '0.5.2'

      - name: Install mdbook-linkcheck2
        run: cargo install mdbook-linkcheck2 --version 0.13.0

      - name: Install mdbook-mermaid
        # Must match the committed book/mermaid*.js, which `mdbook-mermaid
        # install` generates.
        run: cargo install mdbook-mermaid --version 0.17.1

      - run: mdbook build
        working-directory: book

      - name: Check fragment links
        # linkcheck2 verifies that link targets exist but not that their
        # #fragment anchors do; lychee resolves fragments against the ids
        # in the generated HTML. --offline keeps web links linkcheck2's job.
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --root-dir ${{ github.workspace }}/book/build/html 'book/build/html/**/*.html'
          fail: true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/build/html
          cname: autocxx.dev
