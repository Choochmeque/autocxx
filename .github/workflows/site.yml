name: github pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build preprocessor
        # ...and the `autocxx-trybuild-child` helper alongside it. The
        # preprocessor compiles the book's code examples through the integration
        # test harness, which runs each build in that helper so that it can
        # report the compiler's diagnostics. Without it a book example that stops
        # compiling fails this job with no indication of why.
        run: cargo build -p autocxx-mdbook-preprocessor -p autocxx-integration-tests

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Must stay on 0.4.x: tools/mdbook-preprocessor links the mdbook
          # 0.4 crate and cannot parse the render context emitted by
          # mdBook 0.5+.
          mdbook-version: '0.4.52'

      - name: Install mdbook-linkcheck
        run: cargo install mdbook-linkcheck
    
      - name: Install mdbook-mermaid
        # 0.15.0 is the last release compatible with mdbook 0.4,
        # which we're pinned to (see the Setup mdBook step).
        run: cargo install mdbook-mermaid --version 0.15.0
    
      - run: mdbook build
        working-directory: book

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/build/html
          #cname: autocxx.rs
