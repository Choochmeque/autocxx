version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # The root workspace: every member's manifest plus the committed Cargo.lock.
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # Pinned to =1.0.81: the integration harness restates this release's
      # flag list through CARGO_ENCODED_RUSTFLAGS, so a release that changed
      # the list would silently stop reaching fixtures - see the comment in
      # integration-tests/Cargo.toml.
      - dependency-name: 'trybuild'

  # Detached from the root workspace, with its own committed Cargo.lock.
  #
  # The other detached crates - examples/* and tools/stress-test - are
  # deliberately absent: without grouping dependabot files one PR per
  # directory, so a shared floor moving means ten near-identical PRs, and
  # the engine-coupled floors (miette, cxx) can only move when the engine's
  # do. All their floors - the handful of engine-independent ones included -
  # are maintained by hand alongside the workspace's.
  - package-ecosystem: 'cargo'
    directory: '/parser/fuzz'
    schedule:
      interval: 'monthly'
    ignore:
      # The fuzz target leans on the path-dependent autocxx-parser's Parse
      # and ToTokens impls, so a major here is usable only in step with the
      # workspace's; the root entry's PR is the signal, and this manifest
      # and lockfile move by hand with it.
      - dependency-name: 'syn'
      - dependency-name: 'quote'
