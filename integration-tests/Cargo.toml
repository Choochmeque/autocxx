[package]
name = "autocxx-integration-tests"
version = "0.30.0"
autotests = false
edition = "2021"
authors = ["Adrian Taylor <adetaylor@chromium.org>"]
license = "MIT OR Apache-2.0"
description = "Safe autogenerated interop between Rust and C++"
repository = "https://github.com/google/autocxx"
keywords = ["ffi"]
categories = ["development-tools::ffi", "api-bindings"]

[dependencies]
proc-macro2 = "1.0.11"
# DO NOT BUMP. Pinned below the release that carries
# https://github.com/dtolnay/trybuild/pull/278 ("Combine all rustflags into
# cargo `--config` arg", merged 2024-07-06), which is what
# https://github.com/dtolnay/trybuild/issues/283 - open, unfixed - reports:
# after it, a caller's own `$RUSTFLAGS` is no longer propagated into the nested
# cargo invocation that builds the generated fixture crate. 1.0.81 predates it,
# so `$RUSTFLAGS` still reaches that child build by ordinary process-env
# inheritance.
#
# What breaks on a bump: the Address Sanitizer CI leg sets its
# instrumentation through `$RUSTFLAGS`, and every test here compiles its Rust
# through trybuild. Drop the propagation and those fixtures build *fine* -
# unsanitized - and the leg goes red, not dark: the two asan canary tests
# (`perform_asan_doom_test`) assert that deliberate corruption is CAUGHT, so
# unsanitized fixtures fail them loudly. A noisy red leg blaming the canaries
# is still a bad way to rediscover this, hence the pin. Hold at 1.0.81 until
# dtolnay/trybuild#283 is fixed, or until a workaround from that thread is in
# place
# here and the canaries have been shown to still trip.
trybuild = "=1.0.81"
# The suite installs its own logger - see `init_logging` - rather than letting
# `test-log` put one on each test, because the filter it wants is an argument
# to that crate's attribute and there are over six hundred of those.
env_logger = "0.11"
rust_info = "0.3.1"
# 1.0.89 for `cc::Build::get_files`, which is how a failed C++ build's
# diagnostics are recovered - see `build_cpp`.
cc = "1.0.89"
quote = "1.0"
once_cell = "1.7"
# This is necessary for building the projects created
# by the trybuild test system...
autocxx = { path = "..", version = "=0.30.0" }
autocxx-engine = { version = "=0.30.0", path = "../engine", features = [
    "build",
] }
moveit = { version = "0.6", features = [ "cxx" ] }
link-cplusplus = "1.0"
tempfile = "3.4"
indoc = "1.0"
log = "0.4"
cxx = "1.0.136"
itertools = "0.10"
rustversion = "1.0"
static_assertions = "1.1.0"

[dependencies.syn]
version = "1.0.39"
features = ["full"]
#features = [ "full", "extra-traits" ]

# The process the harness re-runs to build generated Rust code. `test = false`
# because it contains no tests, and `doc = false` because it has no API to
# document - and because `cargo rustdoc -p autocxx-integration-tests`, which CI
# runs over every package, refuses to work on a package offering it more than
# one documentable target.
[[bin]]
name = "autocxx-trybuild-child"
path = "src/bin/autocxx-trybuild-child.rs"
test = false
doc = false

[[test]]
name = "integration_tests"
path = "tests/lib.rs"

[[test]]
name = "builder_e2e_test"
path = "tests/builder_e2e_test.rs"
harness = true
