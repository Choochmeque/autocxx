[package]
name = "autocxx-integration-tests"
version = "0.30.0"
autotests = false
edition = "2021"
authors = ["Adrian Taylor <adetaylor@chromium.org>"]
license = "MIT OR Apache-2.0"
description = "Safe autogenerated interop between Rust and C++"
repository = "https://github.com/google/autocxx"
keywords = ["ffi"]
categories = ["development-tools::ffi", "api-bindings"]

[dependencies]
proc-macro2 = "1.0.11"
# DO NOT BUMP. `encoded_rustflags` passes the harness's flags through
# `$CARGO_ENCODED_RUSTFLAGS`, which cargo prefers over both `$RUSTFLAGS` and
# `build.rustflags` and never merges with them - so the `--cfg trybuild -A
# dead_code` this release adds through those two channels (`src/rustflags.rs`)
# is restated in `fixture_rustflags` instead. A release which changed that list
# would not reach a fixture at all - the copy here would go on being used, now
# describing flags trybuild no longer asks for.
#
# Not the sanitizer: a fixture's instrumentation is rebuilt from `AUTOCXX_ASAN`
# by `fixture_rustflags` and `$RUSTFLAGS` is removed from the child rather than
# propagated to it, so whether a release forwards it (dtolnay/trybuild#283)
# decides nothing here.
trybuild = "=1.0.81"
# The suite installs its own logger - see `init_logging` - rather than letting
# `test-log` put one on each test, because the filter it wants is an argument
# to that crate's attribute and there are over six hundred of those.
env_logger = "0.11"
rust_info = "0.3.1"
# 1.0.89 for `cc::Build::get_files`, which is how a failed C++ build's
# diagnostics are recovered - see `build_cpp`.
cc = "1.0.89"
quote = "1.0"
once_cell = "1.7"
# To read one field out of `cargo metadata` - see `workspace_target_dir`. A
# dependency of this package no longer reaches the test fixtures, so this is
# paid for once, here.
serde_json = "1.0"
# This is necessary for building the projects created
# by the trybuild test system...
autocxx = { path = "..", version = "=0.30.0" }
autocxx-engine = { version = "=0.30.0", path = "../engine", features = [
    "build",
] }
moveit = { version = "0.6", features = [ "cxx" ] }
link-cplusplus = "1.0"
tempfile = "3.4"
indoc = "1.0"
log = "0.4"
cxx = "1.0.136"
itertools = "0.10"
rustversion = "1.0"
static_assertions = "1.1.0"

[dependencies.syn]
version = "1.0.39"
features = ["full"]
#features = [ "full", "extra-traits" ]

# The process the harness re-runs to build generated Rust code. `test = false`
# because it contains no tests, and `doc = false` because it has no API to
# document - and because `cargo rustdoc -p autocxx-integration-tests`, which CI
# runs over every package, refuses to work on a package offering it more than
# one documentable target.
[[bin]]
name = "autocxx-trybuild-child"
path = "src/bin/autocxx-trybuild-child.rs"
test = false
doc = false

[[test]]
name = "integration_tests"
path = "tests/lib.rs"

[[test]]
name = "builder_e2e_test"
path = "tests/builder_e2e_test.rs"
harness = true
