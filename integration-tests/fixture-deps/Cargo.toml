[package]
name = "autocxx-fixture-deps"
version = "0.30.0"
authors = ["Vladimir Pankratov <sollex.uz@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2021"
publish = false
description = "The dependencies autocxx's test fixtures are built with"
repository = "https://github.com/google/autocxx"

# Every dependency here is unused by this crate's own (empty) library and is
# meant to be: trybuild composes each fixture's manifest out of the
# dependencies of the package it is pointed at, so this list IS the fixture
# manifest. See `fixture_package_dir` in the integration-test harness.
#
# What belongs here is what a generated fixture names. `autocxx` and `cxx` are
# what `include_cpp!` expands to; `moveit` is what a non-trivial type's
# constructors and `emplace` come back as; `link-cplusplus` puts the C++
# standard library on the link line for the fixture's own C++; and
# `once_cell` and `static_assertions` are named directly by fixtures which
# assert a trait is or is not implemented, or hold a `Lazy` across calls.
#
# `quote` is the surprising one, and it is here for a single fixture:
# `test_tricky_destructors` declares a `macro_rules!` of its own and prints the
# type it was handed with `quote::quote!`, so it is the fixture that names the
# crate, not the harness.
#
# Nothing else. Anything a fixture does not name costs every fixture build the
# time to compile it.
[dependencies]
autocxx = { path = "../..", version = "=0.30.0" }
cxx = "1.0.136"
moveit = { version = "0.6", features = ["cxx"] }
link-cplusplus = "1.0"
once_cell = "1.7"
quote = "1.0"
static_assertions = "1.1.0"
